name: Python checks

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Build wheel
        run: python -m build --wheel
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: kzp-training-oop-${{ matrix.os }}-${{ github.run_number }}
          path: dist/*.whl
          if-no-files-found: error
